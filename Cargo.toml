[package]
name = "http-limiter"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "http-limiter"
path = "src/bin/main.rs"

[dependencies]
axum = "^0"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
