name: Release

on:
  release:
    types: ['published']

permissions:
  contents: read

# Passed via env (not inline expressions) to avoid script injection from tag names.
env:
  RELEASE_TAG: ${{ github.ref_name }}
  REPO_NAME: ${{ github.event.repository.name }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}                                                                                                                                                                                                

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Print debug info
        run: |
          echo "RELEASE_TAG: ${RELEASE_TAG}"
          echo "GITHUB_REF: ${GITHUB_REF}"
          echo "GITHUB_EVENT_NAME: ${GITHUB_EVENT_NAME}"
          echo "GITHUB_EVENT_PATH: ${GITHUB_EVENT_PATH}"
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          echo "GITHUB_SHA: ${GITHUB_SHA}"
          echo "GITHUB_ACTOR: ${GITHUB_ACTOR}"

      - name: Resolve version from release tag
        id: version
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "ERROR: release tag '${RELEASE_TAG}' is not a valid version (expected [v]MAJOR.MINOR.PATCH[-suffix])."
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  release-pre-checks:
    name:  Test, lint and attempt to build
    needs: prepare
    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v7

    - name: Run clippy
      run: cargo clippy --verbose --all-targets --all-features  -- -D warnings

    - name: Run tests
      run: cargo test --verbose

    - name: Run fmt
      run: cargo fmt -- --check

    - name: Install dependencies
      run: cargo build

  create-release:
    name: create-release
    needs: ['release-pre-checks']
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create release if it does not exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "Release exists, no need to create"
          else
            echo "No release found, creating one"
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG"
          fi

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [prepare, create-release]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: x86_64-pc-windows-gnu
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 2. Add caching to make subsequent runs much faster
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      
      - name: Install aarch64 cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      
      - name: Configure linker for aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> .cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> .cargo/config.toml
          
      - name: Update version in Cargo.toml to match release tag
        shell: bash
        run: |
          # Only touch the [package] section; VERSION is validated in the prepare job.
          sed -i.bak '/^\[package\]/,/^\[/ s/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml
          grep -qx "version = \"$VERSION\"" Cargo.toml || { echo "ERROR: failed to set version in Cargo.toml"; exit 1; }

      - name: Debug info
        run: |
          cat Cargo.toml
          rustc --version
          cargo --version
          echo rustup target list --installed
          rustup target list --installed
          echo rustup toolchain list
          rustup toolchain list

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        
      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          ARCHIVE="${REPO_NAME}-${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" http-limiter
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Package (Windows)
        shell: bash
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          ARCHIVE="${REPO_NAME}-${RELEASE_TAG}-${{ matrix.target }}.zip"
          7z a "$ARCHIVE" http-limiter.exe
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload artifacts (Unix)
        uses: actions/upload-artifact@v7
        if: matrix.os != 'windows-latest'
        with:
          name: release-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ env.REPO_NAME }}-*.tar.gz
            target/${{ matrix.target }}/release/${{ env.REPO_NAME }}-*.tar.gz.sha256

      - name: Upload artifacts (Windows)
        uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-latest'
        with:
          name: release-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ env.REPO_NAME }}-*.zip
            target/${{ matrix.target }}/release/${{ env.REPO_NAME }}-*.zip.sha256

  deploy-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Debug info
        run: |
          tree -a -L 2 . 
          ls -la artifacts

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in artifacts/*.tar.gz artifacts/*.zip artifacts/*.sha256; do
            # Ensure the file actually exists before trying to upload
            [ -e "$file" ] || continue
            gh release upload "${RELEASE_TAG}" "${file}" --clobber
          done

  build-container-image:
    needs: [prepare, create-release]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      deployments: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Login to GHCR                                                                                                                                                                                                                   
        uses: docker/login-action@v4                                                                                                                                                                                                          
        with:                                                                                                                                                                                                                                 
          registry: ghcr.io                                                                                                                                                                                                                   
          username: ${{ github.actor }}                                                                                                                                                                                                       
          password: ${{ secrets.GITHUB_TOKEN }}
                                                                                                                                                                                                                                              
      - name: Set up Docker Buildx                                                                                                                                                                                                            
        uses: docker/setup-buildx-action@v4                                                                                                                                                                                                   
                                                                                                                                                                                                                                              
      - name: Build and push image                                                                                                                                                                                                            
        uses: docker/build-push-action@v7                                                                                                                                                                                                     
        with:                                                                                                                                                                                                                                 
          context: .                                                                                                                                                                                                                          
          file: ./deployments/docker/dockerfile                                                                                                                                                                                               
          push: true                                                                                                                                                                                                                          
          attests: type=sbom                                                                                                                                                                                                                  
          cache-from: type=gha                                                                                                                                                                                                                
          cache-to: type=gha,mode=max                                                                                                                                                                                                         
          tags: |                                                                                                                                                                                                                             
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}                                                                                                                                                                                      
            ${{ env.IMAGE_NAME }}:latest                                                                                                                                                                                                      
          build-args: |                                                                                                                                                                                                                       
            BUILD_DATE=${{ github.event.repository.pushed_at }}                                                                                                                                                                               
            BUILD_REVISION=${{ github.sha }}                                                                                                                                                                                                  
            BUILD_VERSION=${{ github.ref_name }}                                                                                                                                                                                              
            BUILD_ATTESTATION=true                                                                                                                                                                                                            
